<style>
html,body{margin:0;height:100%;background:#1b1b2f;overflow:hidden}
#ldr{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:min(5vh,28px);-webkit-user-select:none;user-select:none}
.ball{position:relative;width:min(34vmin,170px);height:min(34vmin,170px);border-radius:50%;overflow:hidden;box-sizing:border-box;border:min(1.6vmin,8px) solid #111;
 background:linear-gradient(#e3202a 0,#e3202a 47%,#111 47%,#111 53%,#f4f4f4 53%);box-shadow:0 0 34px #e3202a44,inset -10px -14px 26px #0005;animation:spin 1.6s linear infinite}
.ball::before{content:'';position:absolute;left:50%;top:50%;width:30%;height:30%;transform:translate(-50%,-50%);border-radius:50%;background:#f4f4f4;border:min(1.6vmin,8px) solid #111;box-sizing:border-box;box-shadow:inset 0 0 0 min(1vmin,5px) #fff}
.ball::after{content:'';position:absolute;left:16%;top:10%;width:30%;height:17%;border-radius:50%;background:radial-gradient(#ffffffaa,#fff0 70%);transform:rotate(-32deg)}
.tx{font:900 clamp(16px,min(4.4vw,6vh),26px) system-ui,-apple-system,Arial,sans-serif;letter-spacing:.32em;padding-left:.32em;color:#ffcc33;animation:pulse 1.4s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
</style>

<div id="ldr"><div class="ball"></div><div class="tx">LOADING</div></div>
<script>
// Small start page: shows the loading screen right away (and gives link previews a light page to read),
// downloads the full game with a progress count, then loads it into this same page.
(function(){var x=document.querySelector('#ldr .tx');
function show(t){document.open();document.write(t);document.close()}
fetch('game.html').then(function(r){if(!r.ok)throw new Error(r.status);var n=1828692; // uncompressed size of game.html
 if(!r.body||!window.TextDecoder)return r.text();
 var rd=r.body.getReader(),dec=new TextDecoder(),parts=[],got=0;
 return (function pump(){return rd.read().then(function(c){if(c.done){parts.push(dec.decode());return parts.join('')}
  got+=c.value.length;parts.push(dec.decode(c.value,{stream:true}));if(x)x.textContent='LOADING '+Math.min(99,Math.floor(got*100/n))+'%';return pump()})})()})
 .then(show).catch(function(){location.replace('game.html')})})();
</script>
